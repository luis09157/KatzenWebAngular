name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (ChromeHeadless)
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build producción
        # Si falla, los errores salen como anotaciones (visibles en el PR sin abrir el log).
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            grep -E "Error|error TS|NG[0-9]|budget|exceeded" build.log | head -25 | sed 's/^/::error::/'
            exit 1
          }
