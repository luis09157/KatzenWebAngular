<div class="admin-dialog-shell">
  <header class="admin-dialog-header">
    <div class="admin-dialog-header__text">
      <h2 class="admin-dialog-title">Registrar movimiento</h2>
      <p class="admin-dialog-subtitle">Cobro de caja (efectivo, tarjeta o transferencia) con control de IVA.</p>
    </div>
    <button mat-icon-button type="button" class="admin-dialog-close" (click)="cancelar()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="admin-dialog-body">
    <form [formGroup]="form" class="caja-form">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="tipo">
            <mat-option *ngFor="let t of tipos" [value]="t.value">{{ t.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha</mat-label>
          <input matInput type="date" formControlName="fecha" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-span">
          <mat-label>Concepto *</mat-label>
          <input matInput formControlName="concepto" placeholder="Ej. Baño completo Oreon" />
          <mat-error *ngIf="form.get('concepto')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Monto (MXN) *</mat-label>
          <input matInput type="number" formControlName="monto" min="0.01" step="0.01" />
          <span matPrefix>$&nbsp;</span>
          <mat-error *ngIf="form.get('monto')?.invalid">Monto válido requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Método de pago *</mat-label>
          <mat-select formControlName="metodoPago">
            <mat-option *ngFor="let m of metodos" [value]="m.value">{{ m.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-span">
          <mat-label>Notas</mat-label>
          <textarea matInput formControlName="notas" rows="2"></textarea>
        </mat-form-field>
      </div>

      <label class="iva-check">
        <mat-checkbox formControlName="ivaDeclarado"></mat-checkbox>
        <span>IVA declarado (control fiscal)</span>
      </label>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="admin-dialog-actions">
    <button mat-button type="button" (click)="cancelar()" [disabled]="loading">Cancelar</button>
    <button
      mat-raised-button
      color="primary"
      class="btn-primary-teal"
      type="button"
      data-cy="caja-guardar"
      (click)="guardar()"
      [disabled]="loading">
      <mat-icon *ngIf="!loading">payments</mat-icon>
      {{ loading ? 'Guardando…' : 'Registrar' }}
    </button>
  </mat-dialog-actions>
</div>
