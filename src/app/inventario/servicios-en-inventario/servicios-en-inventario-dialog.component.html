<div class="admin-dialog-shell sei-dialog">
  <header class="admin-dialog-header">
    <div class="admin-dialog-header__text">
      <h2 class="admin-dialog-title">Servicios guardados como producto</h2>
      <p class="admin-dialog-subtitle">
        Revisa la lista. Los marcados salen del inventario; los nuevos pasan al Catálogo de servicios con el mismo precio.
      </p>
    </div>
    <button mat-icon-button type="button" class="admin-dialog-close" (click)="cerrar()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="admin-dialog-body sei-body">
    <div *ngIf="loading" class="loading-container"><mat-spinner diameter="40"></mat-spinner></div>

    <p class="sei-vacio" *ngIf="!loading && !candidatos.length">No hay servicios guardados como producto. Todo en orden.</p>

    <ng-container *ngIf="!loading && candidatos.length">
      <section class="sei-grupo" *ngFor="let d of destinos">
        <ng-container *ngIf="delDestino(d).length as n">
          <h3 class="sei-grupo__titulo">{{ destinoLabels[d] }} <span class="sei-grupo__n">{{ n }}</span></h3>
          <label class="sei-item" *ngFor="let c of delDestino(d)" [class.sei-item--off]="!marcado(c)">
            <mat-checkbox color="primary" [checked]="marcado(c)" (change)="alternar(c, $event.checked)"></mat-checkbox>
            <span class="sei-item__nombre">
              {{ c.nombre }}
              <small *ngIf="c.servicioExistente && c.servicioExistente !== c.nombre">→ {{ c.servicioExistente }}</small>
              <small *ngIf="c.tipoServicio">· {{ tipoLabels[c.tipoServicio] }}</small>
              <small class="sei-item__motivo" *ngIf="c.motivoNoMover">· {{ c.motivoNoMover }}</small>
            </span>
            <span class="sei-item__precio">{{ formatMoney(c.precioVenta) }}</span>
          </label>
        </ng-container>
      </section>
    </ng-container>
  </mat-dialog-content>

  <div class="admin-dialog-actions">
    <button mat-button type="button" (click)="cerrar()">Cancelar</button>
    <button
      mat-raised-button
      color="primary"
      class="btn-primary-teal"
      type="button"
      [disabled]="loading || !elegidos.length"
      (click)="mover()"
    >
      Mover {{ elegidos.length }}
    </button>
  </div>
</div>
