<div class="admin-page domicilios-pagina">
  <div class="admin-list-shell">
    <app-admin-page-banner
      accent="teal"
      icon="local_shipping"
      title="Domicilios"
      subtitle="Cuántos van, cuánto se cobró, cuánto costó la gasolina y cuánto quedó."
    >
      <div bannerActions>
        <button mat-raised-button color="primary" class="btn-primary-teal" type="button" (click)="irAConfiguracion()">
          <mat-icon>local_gas_station</mat-icon>
          Gasolina y ganancia
        </button>
      </div>
    </app-admin-page-banner>

    <app-domicilios-metricas [mesActual]="true"></app-domicilios-metricas>
  </div>

  <section id="domicilios-config" class="domicilios-pagina__config">
    <app-domicilio-tarifas-panel [puedeEditar]="true"></app-domicilio-tarifas-panel>
  </section>
</div>
