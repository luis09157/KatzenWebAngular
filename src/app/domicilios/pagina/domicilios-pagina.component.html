      <div bannerActions>
        <button mat-raised-button color="primary" class="btn-primary-teal" type="button" (click)="abrirConfiguracion()">

      </div>
    </app-admin-page-banner>

    <app-domicilios-metricas [mesActual]="true"></app-domicilios-metricas>

</div>
