<div class="admin-dialog-shell admin-dialog-shell--picker timepicker-dialog">
  <header class="admin-dialog-header">
    <div class="admin-dialog-header__text">
      <h2 class="admin-dialog-title">{{ title }}</h2>
      <p class="admin-dialog-subtitle">Elige hora, minutos y periodo</p>
    </div>
    <button
      mat-icon-button
      type="button"
      class="admin-dialog-close"
      aria-label="Cerrar selector de hora"
      (click)="cancelar()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="admin-dialog-body timepicker-dialog__body">
    <p class="timepicker-dialog__preview" aria-live="polite">{{ previewDisplay }}</p>

    <div class="timepicker-dialog__controls">
      <mat-form-field appearance="outline" class="timepicker-dialog__field">
        <mat-label>Hora</mat-label>
        <mat-select [(ngModel)]="hour12" aria-label="Hora">
          <mat-option *ngFor="let h of hourOptions" [value]="h">
            {{ h < 10 ? '0' + h : h }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="timepicker-dialog__field">
        <mat-label>Minutos</mat-label>
        <mat-select [(ngModel)]="minute" aria-label="Minutos">
          <mat-option *ngFor="let m of minuteOptions" [value]="m">
            {{ padMinute(m) }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-button-toggle-group
      class="timepicker-dialog__period"
      [(ngModel)]="period"
      name="periodo"
      aria-label="Periodo a.m. o p.m.">
      <mat-button-toggle value="am">a.m.</mat-button-toggle>
      <mat-button-toggle value="pm">p.m.</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <footer class="admin-dialog-actions">
    <button mat-button type="button" (click)="cancelar()">
      Cancelar
    </button>
    <button mat-raised-button type="button" class="btn-primary-teal" (click)="aceptar()">
      Aceptar
    </button>
  </footer>
</div>
