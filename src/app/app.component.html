<!-- Splash hasta 1ª ruta: evita blanco entre bootstrap Angular y GuestGuard/Auth -->
<div *ngIf="!bootReady" class="kv-boot-splash" role="status" aria-live="polite" aria-busy="true">
  <div class="kv-boot-splash__card">
    <img class="kv-boot-splash__logo" src="assets/katzen-logo.jpg" width="72" height="72" alt="KatzenVet" />
    <p class="kv-boot-splash__title">KatzenVet</p>
    <p class="kv-boot-splash__hint">Cargando…</p>
    <div class="kv-boot-splash__spinner" aria-hidden="true"></div>
  </div>
</div>

<!-- Wrapper con z-index alto cuando hay loading para que el overlay quede por encima de los modales Material -->
<div
  class="app-content"
  [class.app-content--booting]="!bootReady"
  [class.global-loading-active]="globalLoading.isLoading | async"
>
  <!-- Overlay global de carga: spinner + texto al centro -->
  <div *ngIf="globalLoading.isLoading | async" class="global-loading-overlay" aria-live="polite" aria-busy="true">
    <div class="global-loading-content">
      <mat-spinner diameter="56" color="primary"></mat-spinner>
      <p class="global-loading-text">{{ (globalLoading.message | async) || 'Cargando…' }}</p>
    </div>
  </div>
  <router-outlet></router-outlet>
</div>
